<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light" id="body">

<!-- Sidebar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand px-3" href="#">Dashboard Bosku</a>
  <button class="btn btn-outline-light ms-auto" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</nav>

<div class="container-fluid mt-4">
  <div class="row">
    <!-- Accordion Menu -->
    <div class="col-md-3">
      <div class="accordion" id="accordionMenu">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
              📂 Kategori
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <ul id="kategoriList" class="list-group">
                <li class="list-group-item">Aktif</li>
                <li class="list-group-item">Nawala</li>
                <li class="list-group-item">Arsip</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9">
      <!-- Search -->
      <input type="text" id="searchBox" class="form-control mb-3" placeholder="🔍 Cari data...">

      <!-- Statistik -->
      <div class="card mb-3">
        <div class="card-body">
          <canvas id="statistikChart"></canvas>
        </div>
      </div>

      <!-- Data Table -->
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Status</th>
            <th>Kategori</th>
          </tr>
        </thead>
        <tbody id="dataTable">
          <tr>
            <td>Angga</td>
            <td><span class="badge bg-success">Aktif</span></td>
            <td>Staff</td>
          </tr>
          <tr>
            <td>Budi</td>
            <td><span class="badge bg-danger">Expired</span></td>
            <td>Staff</td>
          </tr>
        </tbody>
      </table>

      <!-- Backup & Export -->
      <button class="btn btn-secondary" onclick="backupData()">📦 Backup JSON</button>
      <button class="btn btn-success" onclick="exportExcel()">📊 Export Excel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
